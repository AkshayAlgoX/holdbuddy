name: HoldBuddy CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Typecheck, Build, and Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Production Build Verification
        run: npm run build

      - name: Run Test Suite (Node.js Test Runner)
        run: npm test

      - name: Secret Leak Prevention Check
        run: |
          echo "Scanning for accidental credential patterns..."
          ! git grep -iE "(GNANI_API_KEY\s*=\s*['\"][A-Za-z0-9_\-]{10,}|password\s*=\s*['\"][^'\"]{6,})" -- ':!.env.example' ':!docs/*'
